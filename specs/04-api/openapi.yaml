openapi: 3.1.0
info:
  title: ABC Electronic Invoicing – Service contracts
  version: 0.1.0-spec
  license:
    name: Proprietary – ABC Software Corp
    identifier: LicenseRef-Propietario
  description: |
    Contract of the system's **input ports** (see specs/03-arquitectura).
    In the monolith these endpoints are served in-process by the controllers (or a local REST API);
    when migrating to microservices they are exposed as-is over HTTP. Bodies are defined in
    specs/02-dominio/schemas (JSON Schema 2020-12). Errors follow RFC 9457 and name the broken rule
    (R-xx in docs/sunat/reglas-validacion.md or M-xx in specs/06-migracion).
security:
  - sesionLocal: []
servers:
  - url: http://localhost:8080/api/v1
    description: Monolith (local API)
tags:
  - name: Comprobantes
    description: Invoices and receipts — creation, calculation, issuing, query, voiding (CU-03, CU-04, CU-07..CU-11, CU-15)
  - name: Notas
    description: Credit notes (cat. 09) and debit notes (cat. 10) (CU-05, CU-06)
  - name: Inventario
    description: Permanent inventory record, Format 12.1 (CU-14)
  - name: Maestros
    description: Customers, products and SUNAT catalogs (CU-01, CU-02)
  - name: Configuracion
    description: Issuer and series (CU-10)
  - name: Migracion
    description: Legacy system migration (CU-13)
  - name: Reportes
    description: Sales and kardex (CU-12)
paths:
  /comprobantes:
    post:
      tags: [Comprobantes]
      operationId: crearComprobante
      summary: Creates an invoice or receipt in status BORRADOR/VALIDADO (CU-03, CU-04)
      description: The system computes values, taxes (CU-15) and totals. No number is assigned until issuing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/comprobante-crear.schema.json' }
            examples:
              factura: { externalValue: '../02-dominio/ejemplos/comprobante-crear.factura.json' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '201':
          description: Document created and validated
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
    get:
      tags: [Comprobantes]
      operationId: listarComprobantes
      summary: Searches documents (CU-08)
      parameters:
        - { name: tipoComprobante, in: query, schema: { type: string, enum: ['01', '03', '07', '08'] } }
        - { name: serie, in: query, schema: { type: string, pattern: '^[FB][A-Z0-9]{3}$' } }
        - { name: estado, in: query, schema: { type: string } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: documentoCliente, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/tamanio'
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Page of documents
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
                  total: { type: integer }
  /comprobantes/validar:
    post:
      tags: [Comprobantes]
      operationId: validarComprobante
      summary: Previews calculation and validations without saving (CU-15)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/comprobante-crear.schema.json' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Calculation OK
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /comprobantes/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Comprobantes]
      operationId: obtenerComprobante
      summary: Detail and status (CU-08)
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /comprobantes/{id}/emitir:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Comprobantes]
      operationId: emitirComprobante
      summary: Assigns the number, generates UBL 2.1 XML, signs and sends to OSE/SUNAT (CU-03, CU-04)
      description: Idempotent with the Idempotency-Key header; retries do not generate a new number.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Issued; status may be ACEPTADO, ACEPTADO_CON_OBSERVACIONES or RECHAZADO
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '202':
          description: Signed but the OSE did not respond; stays PENDIENTE_ENVIO (CU-11)
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /comprobantes/{id}/anular:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Comprobantes]
      operationId: anularComprobante
      summary: Voiding communication or summary depending on type (CU-07)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties: { motivo: { type: string, minLength: 5, maxLength: 100 } }
      security: [ { sesionLocal: [ADMINISTRADOR] } ]
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '202':
          description: Voiding request sent; status changes to ANULADO when the CDR arrives
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }
  /comprobantes/{id}/xml:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Comprobantes]
      operationId: descargarXml
      summary: Signed UBL 2.1 XML
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200': { description: XML firmado, content: { application/xml: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /comprobantes/{id}/cdr:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Comprobantes]
      operationId: descargarCdr
      summary: Receipt confirmation (ZIP with ApplicationResponse)
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200': { description: CDR, content: { application/zip: { schema: { type: string, contentEncoding: base64 } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /comprobantes/{id}/pdf:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Comprobantes]
      operationId: descargarPdf
      summary: Printed representation with QR code
      parameters:
        - { name: formato, in: query, schema: { type: string, enum: [A4, TICKET_80MM], default: A4 } }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200': { description: PDF, content: { application/pdf: { schema: { type: string, contentEncoding: base64 } } } }
  /comprobantes/{id}/enviar-correo:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Comprobantes]
      operationId: enviarCorreo
      summary: Sends PDF and XML to the customer (CU-09)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { correo: { type: string, format: email } }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '202': { description: Envío encolado }
  /comprobantes/reenviar-pendientes:
    post:
      tags: [Comprobantes]
      operationId: reenviarPendientes
      summary: Retries PENDIENTE_ENVIO documents (CU-11)
      security: [ { sesionLocal: [ADMINISTRADOR] } ]
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  procesados: { type: integer }
                  aceptados: { type: integer }
                  rechazados: { type: integer }
                  pendientes: { type: integer }
  /comprobantes/{id}/notas-credito:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Notas]
      operationId: emitirNotaCredito
      summary: Issues a credit note on document {id} (CU-05). Reason from catalog 09
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/nota-crear.schema.json' }
            examples:
              devolucion: { externalValue: '../02-dominio/ejemplos/nota-crear.credito.json' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '201':
          description: Note issued
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /comprobantes/{id}/notas-debito:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Notas]
      operationId: emitirNotaDebito
      summary: Issues a debit note on document {id} (CU-06). Reason from catalog 10
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/nota-crear.schema.json' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '201':
          description: Note issued
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/comprobante.schema.json' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /clientes:
    get:
      tags: [Maestros]
      operationId: buscarClientes
      summary: Searches customers by document or name (CU-01)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Customers
          content:
            application/json:
              schema: { type: array, items: { $ref: '../02-dominio/schemas/cliente.schema.json' } }
    post:
      tags: [Maestros]
      operationId: crearCliente
      summary: Creates a customer – CU-01 (validates RUC/DNI, R-10 to R-12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/cliente.schema.json' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/cliente.schema.json' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /productos:
    get:
      tags: [Maestros]
      operationId: buscarProductos
      summary: Searches products by code or description (CU-02)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Products
          content:
            application/json:
              schema: { type: array, items: { $ref: '../02-dominio/schemas/producto.schema.json' } }
    post:
      tags: [Maestros]
      operationId: crearProducto
      summary: Creates a product – CU-02 (IGV treatment cat. 07, ISC cat. 08, ICBPER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/producto.schema.json' }
            examples:
              cerveza: { externalValue: '../02-dominio/ejemplos/producto-cerveza.json' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/producto.schema.json' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /catalogos/{numero}:
    get:
      tags: [Maestros]
      operationId: obtenerCatalogo
      summary: Returns a SUNAT catalog (docs/sunat/catalogos)
      parameters:
        - { name: numero, in: path, required: true, schema: { type: string, pattern: '^\d{2}$' } }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                required: [catalogo, titulo, codigos]
                properties:
                  catalogo: { type: string }
                  titulo: { type: string }
                  codigos: { type: array, items: { type: object } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /configuracion/emisor:
    get:
      tags: [Configuracion]
      operationId: obtenerEmisor
      summary: Configured issuer data (CU-10)
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Issuer
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/emisor.schema.json' }
    put:
      tags: [Configuracion]
      operationId: actualizarEmisor
      summary: Updates the issuer (CU-10)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/emisor.schema.json' }
      security: [ { sesionLocal: [ADMINISTRADOR] } ]
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/emisor.schema.json' }
  /series:
    get:
      tags: [Configuracion]
      operationId: listarSeries
      summary: Configured series with their last number (CU-10)
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Series
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Serie' } }
    post:
      tags: [Configuracion]
      operationId: crearSerie
      summary: Creates a series – CU-10 (R-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Serie' }
      security: [ { sesionLocal: [ADMINISTRADOR] } ]
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Serie' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /inventario/movimientos:
    post:
      tags: [Inventario]
      operationId: registrarMovimiento
      summary: Records an inventory movement – CU-14 (Format 12.1, RS 234-2006)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../02-dominio/schemas/movimiento-inventario.schema.json' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/movimiento-inventario.schema.json' }
        '422': { $ref: '#/components/responses/ReglaIncumplida' }
  /inventario/kardex:
    get:
      tags: [Reportes]
      operationId: obtenerKardex
      summary: Permanent Inventory Record in Physical Units (Format 12.1) per product and period (CU-12)
      description: JSON (kardex.schema.json) or the PLE 12.1 text file (rules R-60 to R-66).
      parameters:
        - { name: productoId, in: query, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/periodoLibro'
        - $ref: '#/components/parameters/formatoLibro'
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Opening balance, movements with running balance, totals and closing balance
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/kardex.schema.json' }
              examples:
                cerveza: { externalValue: '../02-dominio/ejemplos/kardex.CER-630.2026-10.json' }
            text/plain:
              schema: { type: string, description: 'PLE 12.1 file LE<RUC><AAAAMM00>120100001111.txt, 19 pipe-separated fields per line' }
              examples:
                ple: { externalValue: '../02-dominio/ejemplos/LE2060012345020261000120100001111.txt' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /reportes/ventas:
    get:
      tags: [Reportes]
      operationId: reporteVentas
      summary: Sales Record (Format 14.1) for a period (CU-12)
      description: Built from the accepted and voided CPEs of the period (rules R-70 to R-75). JSON (registro-ventas.schema.json) or the PLE 14.1 text file.
      parameters:
        - $ref: '#/components/parameters/periodoLibro'
        - $ref: '#/components/parameters/formatoLibro'
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: One row per document of the period, 35 fields each
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename=LE<RUC><AAAAMM00>140100001111.txt (formato=ple)' }
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/registro-ventas.schema.json' }
              examples:
                octubre: { externalValue: '../02-dominio/ejemplos/registro-ventas.2026-10.json' }
            text/plain:
              schema: { type: string, description: 'PLE 14.1 file, 35 pipe-separated fields per line' }
              examples:
                ple: { externalValue: '../02-dominio/ejemplos/LE2060012345020261000140100001111.txt' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
  /reportes/ventas/conciliaciones-sire:
    post:
      tags: [Reportes]
      operationId: iniciarConciliacionSire
      summary: Downloads SUNAT's RVIE proposal for the period from SIRE and reconciles it with the company's Sales Record (R-76, ADR-007)
      description: Starts the SIRE ticket flow (exportapropuesta → consultaestadotickets → archivoreporte, SIRE API manual v30). Asynchronous.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [periodo]
              properties:
                periodo: { type: string, pattern: '^\d{4}(0[1-9]|1[0-2])$' }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '202':
          description: Reconciliation started; state EN_PROCESO with the SUNAT ticket
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/conciliacion-sire.schema.json' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '502': { $ref: '#/components/responses/ServicioExterno' }
  /reportes/ventas/conciliaciones-sire/{periodo}:
    parameters: [ { $ref: '#/components/parameters/periodoRuta' } ]
    get:
      tags: [Reportes]
      operationId: obtenerConciliacionSire
      summary: Reconciliation result — documents missing from the proposal, extra documents and field differences (R-76)
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/conciliacion-sire.schema.json' }
              examples:
                octubre: { externalValue: '../02-dominio/ejemplos/conciliacion-sire.2026-10.json' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /reportes/ventas/conciliaciones-sire/{periodo}/aceptar:
    parameters: [ { $ref: '#/components/parameters/periodoRuta' } ]
    post:
      tags: [Reportes]
      operationId: aceptarPropuestaSire
      summary: Accepts the RVIE proposal in SIRE (aceptapropuesta) — only when the period is CONCILIADA (R-76)
      security: [ { sesionLocal: [ADMINISTRADOR] } ]
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '202':
          description: Acceptance sent to SIRE; state ACEPTADA_EN_SIRE when the ticket finishes
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/conciliacion-sire.schema.json' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }
  /migraciones:
    post:
      tags: [Migracion]
      operationId: iniciarMigracion
      summary: Imports the legacy CSV and applies rules M-01..M-07 (CU-13)
      parameters:
        - { name: simulacion, in: query, description: 'true = dry run, writes nothing', schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      security: [ { sesionLocal: [ADMINISTRADOR] } ]
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '202':
          description: Migration started
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/migracion.schema.json' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
  /migraciones/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Migracion]
      operationId: obtenerMigracion
      summary: Status and summary of a migration (CU-13)
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Status and summary
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/migracion.schema.json' }
  /migraciones/{id}/trazabilidad:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Migracion]
      operationId: obtenerTrazabilidadMigracion
      summary: Traces each legacy row → new entities, with M-xx rules applied (M-07)
      parameters:
        - { name: resultado, in: query, schema: { type: string, enum: [MIGRADO, CUARENTENA, DESCARTADO] } }
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '200':
          description: Run traces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrazaMigracion' }
  /migraciones/{id}/revertir:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Migracion]
      operationId: revertirMigracion
      summary: Deletes what that run created (origen = MIGRACION) and marks it REVERTIDA
      security: [ { sesionLocal: [ADMINISTRADOR] } ]
      responses:
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '200':
          description: Rolled back
          content:
            application/json:
              schema: { $ref: '../02-dominio/schemas/migracion.schema.json' }
components:
  securitySchemes:
    sesionLocal:
      type: http
      scheme: bearer
      description: |
        Session token issued at app login (monolith) or by the API Gateway (microservices).
        Roles: VENDEDOR, ALMACENERO, CONTADOR, ADMINISTRADOR (see specs/01-casos-uso, actors).
        Operations marked [ADMINISTRADOR] require that role.
  parameters:
    periodoLibro:
      name: periodo
      in: query
      required: true
      description: Book period AAAAMM (exported as AAAAMM00).
      schema: { type: string, pattern: '^\d{4}(0[1-9]|1[0-2])$' }
    periodoRuta:
      name: periodo
      in: path
      required: true
      description: Book period AAAAMM.
      schema: { type: string, pattern: '^\d{4}(0[1-9]|1[0-2])$' }
    formatoLibro:
      name: formato
      in: query
      description: json (default) or ple (SUNAT Electronic Books Program text file).
      schema: { type: string, enum: [json, ple], default: json }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    tamanio:
      name: tamanio
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Serie:
      type: object
      additionalProperties: false
      required: [codigo, tipoComprobante]
      properties:
        codigo: { type: string, pattern: '^[FB][A-Z0-9]{3}$' }
        tipoComprobante: { type: string, enum: ['01', '03', '07', '08'] }
        ultimoCorrelativo: { type: integer, minimum: 0, maximum: 99999999, readOnly: true }
        activa: { type: boolean, default: true }
    TrazaMigracion:
      type: object
      required: [idLegado, resultado]
      properties:
        idLegado: { type: string }
        resultado: { type: string, enum: [MIGRADO, CUARENTENA, DESCARTADO] }
        reglas: { type: array, items: { type: string, pattern: '^M-\d{2}$' } }
        idsNuevos: { type: array, items: { type: string, format: uuid } }
        motivo: { type: string }
  responses:
    NoAutorizado:
      description: No valid session
      content:
        application/problem+json:
          schema: { $ref: '../02-dominio/schemas/error.schema.json' }
    SinPermiso:
      description: The user's role does not allow the operation
      content:
        application/problem+json:
          schema: { $ref: '../02-dominio/schemas/error.schema.json' }
    SolicitudInvalida:
      description: The body does not match the JSON Schema
      content:
        application/problem+json:
          schema: { $ref: '../02-dominio/schemas/error.schema.json' }
    ReglaIncumplida:
      description: Matches the schema but breaks a business rule (R-xx)
      content:
        application/problem+json:
          schema: { $ref: '../02-dominio/schemas/error.schema.json' }
          examples:
            validacion: { externalValue: '../02-dominio/ejemplos/error.validacion.json' }
    EstadoInvalido:
      description: The operation is not allowed in the document's current status
      content:
        application/problem+json:
          schema: { $ref: '../02-dominio/schemas/error.schema.json' }
    ServicioExterno:
      description: SUNAT's SIRE API did not answer or returned an error; retry later
      content:
        application/problem+json:
          schema: { $ref: '../02-dominio/schemas/error.schema.json' }
    NoEncontrado:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '../02-dominio/schemas/error.schema.json' }
