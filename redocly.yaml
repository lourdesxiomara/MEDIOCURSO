# Configuración de lint para specs/04-api/openapi.yaml  (npx @redocly/cli lint specs/04-api/openapi.yaml)
extends:
  - recommended
rules:
  # Falso positivo: los schemas usan if/then para exigir propiedades ya definidas en el objeto padre
  # (ej. sistemaIsc solo si el tributo es 2000). Redocly no resuelve properties del padre dentro de then.
  no-required-schema-properties-undefined: off
  # Intencional: el monolito expone la API en la máquina local (ADR-001, ADR-003).
  no-server-example.com: off
