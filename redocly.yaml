# Lint configuration for specs/04-api/openapi.yaml  (npx @redocly/cli lint specs/04-api/openapi.yaml)
extends:
  - recommended
rules:
  # False positive: schemas use if/then to require properties already defined in the parent object
  # (e.g. sistemaIsc only when the tax is 2000). Redocly does not resolve parent properties inside then.
  no-required-schema-properties-undefined: off
  # Intentional: the monolith exposes the API on the local machine (ADR-001, ADR-003).
  no-server-example.com: off
